<h1 class="auth-form__title">Welcome Back</h1>
<p class="auth-form__subtitle">Log in to your account to continue shopping</p>

<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
        <mat-label>Email Address</mat-label>
        <mat-icon matPrefix>mail_outline</mat-icon>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.hasError('required')) {
        <mat-error>Email is required</mat-error>
        } @else if (form.controls.email.hasError('email')) {
        <mat-error>Enter a valid email address</mat-error>
        }
    </mat-form-field>

    <app-password-field [control]="form.controls.password" label="Password"
        autocomplete="current-password" />

    <div class="auth-form__options">
        <mat-checkbox formControlName="rememberMe">Remember me</mat-checkbox>
        <a class="auth-form__forgot" routerLink="/account/forgot-password">Forgot password?</a>
    </div>

    <button mat-flat-button class="auth-form__submit" type="submit"
        [disabled]="form.invalid || loading.isLoading()">
        @if (loading.isLoading()) {
        <span class="auth-form__submit-loading">
            <mat-spinner diameter="18" />
            Logging in…
        </span>
        } @else {
        Log in
        }
    </button>
</form>

<div class="auth-form__divider"><span>Or continue with</span></div>

<div #googleButton class="auth-form__google"></div>
