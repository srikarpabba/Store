<h2 mat-dialog-title class="confirm-dialog__title">{{ data.title }}</h2>

<mat-dialog-content class="confirm-dialog__message">
    {{ data.message }}
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="false">
        {{ data.cancelLabel ?? 'Cancel' }}
    </button>
    <button mat-flat-button [mat-dialog-close]="true" cdkFocusInitial
        [class.confirm-dialog__confirm--destructive]="data.destructive">
        {{ data.confirmLabel ?? 'Confirm' }}
    </button>
</mat-dialog-actions>
