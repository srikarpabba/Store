<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store — Fashion &amp; Lifestyle Shopping</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description"
      content="Shop the latest fashion for men and women at Store — new arrivals, exclusive designs and sale offers with free shipping on orders over $99." />
    <meta name="theme-color" content="#e11d24" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
      /* Bootstrap splash — Angular replaces <app-root>'s content on startup.
         Inlined so it renders before any bundle loads; keep the logo styling
         in sync with .logo in header.css */
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }

      .splash__logo {
        font-family: Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.02em;
        color: #000000;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }

      .splash__logo span {
        color: #e11d24;
      }

      @keyframes splash-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="splash" role="status" aria-label="Loading Store">
        <div class="splash__logo">STORE<span>.</span></div>
      </div>
    </app-root>
  </body>
</html>
