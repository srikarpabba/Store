<div class="auth-page">
    <div class="auth-card">
        <div class="auth-card__body">
            <h1 class="auth-form__title">Set a password</h1>
            <p class="auth-form__subtitle">
                Your account was created with Google sign-in and has no password yet.
                Set one to also log in with your email and password.
            </p>

            <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
                <app-password-field [control]="form.controls.password" label="New Password"
                    autocomplete="new-password"
                    hint="Min 8 chars with uppercase, lowercase, number & special character" />

                <app-password-field [control]="form.controls.confirmPassword" label="Confirm Password"
                    autocomplete="new-password" requiredMessage="Please confirm your password" />

                @if (form.hasError('passwordMismatch') && form.controls.confirmPassword.touched) {
                <p class="auth-form__error" role="alert">
                    <mat-icon>error_outline</mat-icon>
                    <span>Passwords do not match</span>
                </p>
                }

                <button mat-flat-button class="auth-form__submit" type="submit"
                    [disabled]="form.invalid || loading.isLoading()">
                    @if (loading.isLoading()) {
                    <span class="auth-form__submit-loading">
                        <mat-spinner diameter="18" />
                        Setting…
                    </span>
                    } @else {
                    Set password
                    }
                </button>
            </form>

            <a class="auth-form__back-btn" routerLink="/account/dashboard">
                <mat-icon>arrow_back</mat-icon>
                Back to My Account
            </a>
        </div>
    </div>
</div>
